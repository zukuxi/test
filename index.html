
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说章节抓取与 EPUB 导出</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --panel: #fff;
  --fg: #202124;
  --muted: #666;
  --line: #d9dce1;
  --accent: #2868d7;
}
* { box-sizing: border-box; }
body {
  margin: 0 auto;
  padding: 16px;
  max-width: 900px;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 system-ui, sans-serif;
}
h1 { font-size: 23px; margin: 0 0 12px; }
h2 { font-size: 18px; margin: 20px 0 8px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin: 12px 0;
}
label { display: block; margin: 10px 0 4px; font-weight: 600; }
input, select, textarea, button {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  background: var(--panel);
  color: var(--fg);
  font: inherit;
}
button {
  cursor: pointer;
  background: var(--accent);
  color: white;
  border: 0;
  font-weight: 600;
  margin-top: 8px;
}
button:disabled { opacity: .5; cursor: wait; }
.row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.small { color: var(--muted); font-size: 13px; }
#status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 10px;
  border-radius: 8px;
  background: var(--bg);
  min-height: 45px;
}
#chapterList {
  max-height: 300px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
}
.chapter-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
}
.chapter-item input {
  width: 18px;
  min-height: 18px;
  margin-top: 5px;
}
.chapter-item span { overflow-wrap: anywhere; }
#preview {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 450px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151619;
    --panel: #202125;
    --fg: #eee;
    --muted: #aaa;
    --line: #3b3d44;
    --accent: #376fd1;
  }
}
</style>
</head>
<body>

<h1>小说章节抓取与 EPUB 导出</h1>
<p class="small">读取小说目录、抓取章节正文，并导出为 EPUB 电子书。</p>

<div class="panel">
  <h2>1. 小说目录和起始章节</h2>

  <label for="directoryUrl">小说目录网址</label>
  <input id="directoryUrl" type="url"
    value="https://duskblossoms.com/novel/en-travesti-i-became-a-fake-prince/">

  <button id="readDirectoryBtn">读取目录并生成章节列表</button>

  <p class="small">
    如果目录只提供 Read First / Read Last，会尝试按章节网址规律生成章节列表。
    推导出来的网址不一定全部有效。
  </p>

  <label for="chapterSelect">选择起始章节</label>
  <select id="chapterSelect">
    <option value="">请先读取目录，或直接输入下面的网址</option>
  </select>

  <label for="startUrl">起始章节网址</label>
  <input id="startUrl" type="url"
    placeholder="https://example.com/chapter-1/">

  <div class="row">
    <div>
      <label for="maxChapters">最多抓取章节数</label>
      <input id="maxChapters" type="number" min="1" max="2000" value="100">
    </div>
    <div>
      <label for="delay">每章间隔（毫秒）</label>
      <input id="delay" type="number" min="0" max="60000" value="1200">
    </div>
  </div>

  <button id="crawlBtn">开始抓取章节</button>
</div>

<div class="panel">
  <h2>2. 章节列表</h2>
  <div class="row">
    <button id="selectAllBtn" type="button">全选可用章节</button>
    <button id="selectNoneBtn" type="button">取消全选</button>
  </div>
  <div id="chapterList">
    <p class="small">章节抓取后会显示在这里。</p>
  </div>
  <p class="small">
    检测到付费章节时会停止抓取，不会继续请求下一章。
  </p>
</div>

<div class="panel">
  <h2>3. 正文预览</h2>
  <div class="row">
    <div>
      <label for="fontSize">字体大小（px）</label>
      <input id="fontSize" type="number" min="12" max="36" value="18">
    </div>
    <div>
      <label for="lineHeight">行高</label>
      <input id="lineHeight" type="number" min="1" max="3" step="0.1" value="1.8">
    </div>
  </div>
  <div id="preview" style="font-size:18px;line-height:1.8">
    抓取完成后，点击章节旁边的预览按钮查看正文。
  </div>
</div>

<div class="panel">
  <h2>4. 导出 EPUB</h2>

  <label for="bookTitle">书名</label>
  <input id="bookTitle" value="En Travesti, I Became a Fake Prince">

  <label for="author">作者（可选）</label>
  <input id="author" placeholder="作者名">

  <button id="exportBtn">导出选中的章节为 EPUB</button>
  <p class="small">导出需要网络加载 JSZip 库。</p>
</div>

<div class="panel">
  <h2>运行状态</h2>
  <div id="status">页面初始化成功，正在等待操作。</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script>
"use strict";

const $ = id => document.getElementById(id);

let chapters = [];
let busy = false;

window.addEventListener("error", function(e) {
  const status = $("status");
  if (status) {
    status.textContent =
      "JavaScript 错误：" + (e.message || "未知错误") +
      (e.lineno ? "\n行号：" + e.lineno : "");
  }
});

window.addEventListener("unhandledrejection", function(e) {
  const status = $("status");
  if (status) {
    status.textContent = "异步错误：" +
      (e.reason && e.reason.message
        ? e.reason.message
        : String(e.reason));
  }
});

function log(message) {
  $("status").textContent = message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function cleanText(value) {
  return (value || "").replace(/\s+/g, " ").trim();
}

function text(element) {
  return cleanText(element ? element.textContent : "");
}

function absolute(href, base) {
  if (!href) return "";
  try {
    return new URL(href, base).href;
  } catch {
    return "";
  }
}

function sameHost(a, b) {
  try {
    return new URL(a).hostname === new URL(b).hostname;
  } catch {
    return false;
  }
}

/*
 * 通过代理读取网页。
 * 使用路径形式的代理地址，不再使用 ?url= 参数。
 *
 * 如果这里返回 HTTP 错误，说明代理请求仍然失败；
 * 页面会显示状态码和部分返回内容，方便进一步诊断。
 */
async function getPage(url) {
  let target;

  try {
    target = new URL(url);
  } catch {
    throw new Error("网址格式不正确：" + url);
  }

  if (target.protocol !== "https:" && target.protocol !== "http:") {
    throw new Error("只支持 HTTP 或 HTTPS 网址。");
  }

  const proxyUrl =
    "https://corsproxy.nl/" +
    target.protocol.slice(0, -1) + "/" +
    target.host +
    target.pathname +
    target.search +
    target.hash;

  let response;

  try {
    response = await fetch(proxyUrl, {
      method: "GET",
      cache: "no-store"
    });
  } catch (error) {
    throw new Error(
      "无法连接网页代理。\n" +
      (error.message || String(error)) +
      "\n请检查网络、代理服务或浏览器控制台。"
    );
  }

  const responseText = await response.text();

  if (!response.ok) {
    throw new Error(
      "网页请求失败，HTTP " + response.status +
      "\n代理返回：" + responseText.slice(0, 400)
    );
  }

  if (!responseText || responseText.length < 100) {
    throw new Error("返回内容为空或过短，可能是代理或目标网站拦截。");
  }

  return new DOMParser().parseFromString(responseText, "text/html");
}

function isReadFirst(anchor) {
  return /^read\s+first$/i.test(text(anchor));
}

function isReadLast(anchor) {
  return /^read\s+last$/i.test(text(anchor));
}

function getAnchorUrl(anchor, base) {
  return absolute(anchor.getAttribute("href"), base);
}

function chapterNumber(value) {
  const s = String(value || "");
  const patterns = [
    /chapter[-_\s]*(\d+)/i,
    /第\s*(\d+)\s*章/i,
    /(?:^|\s)(\d+)(?:\s|$)/
  ];

  for (const pattern of patterns) {
    const match = s.match(pattern);
    if (match) return Number(match[1]);
  }

  return null;
}

function sortChapters(items) {
  return items.sort((a, b) => {
    const na = chapterNumber(a.title || a.url);
    const nb = chapterNumber(b.title || b.url);

    if (na !== null && nb !== null) return na - nb;
    return (a.title || "").localeCompare(b.title || "");
  });
}

/*
 * 先查找目录中直接列出的章节。
 * 如果只有 Read First / Read Last，则尝试推导连续的章节网址。
 */
function findDirectoryChapters(doc, directoryUrl) {
  const directory = new URL(directoryUrl);
  const links = [...doc.querySelectorAll("a[href]")];
  const found = [];
  const seen = new Set();

  for (const a of links) {
    if (isReadFirst(a) || isReadLast(a)) continue;

    const href = getAnchorUrl(a, directoryUrl);
    if (!href || seen.has(href)) continue;

    let u;

    try {
      u = new URL(href);
    } catch {
      continue;
    }

    if (u.hostname !== directory.hostname) continue;

    const label = text(a);
    const looksLikeChapter =
      /chapter/i.test(u.pathname) ||
      /\bchapter\s*[\d:.-]+/i.test(label) ||
      /第\s*\d+\s*章/.test(label);

    if (!looksLikeChapter) continue;

    if (/\/(tag|category|author|login|register)\//i.test(u.pathname)) {
      continue;
    }

    seen.add(href);
    found.push({
      url: href,
      title: label || u.pathname
    });
  }

  if (found.length > 2) {
    return sortChapters(found);
  }

  const firstLink = links.find(isReadFirst);
  const lastLink = links.find(isReadLast);

  if (!firstLink || !lastLink) return sortChapters(found);

  const firstUrl = getAnchorUrl(firstLink, directoryUrl);
  const lastUrl = getAnchorUrl(lastLink, directoryUrl);

  if (!firstUrl || !lastUrl) return sortChapters(found);

  let firstPath, lastPath;

  try {
    firstPath = new URL(firstUrl).pathname;
    lastPath = new URL(lastUrl).pathname;
  } catch {
    return sortChapters(found);
  }

  const firstMatch = firstPath.match(/^(.*?chapter[-_/]?)(\d+)(\/?)$/i);
  const lastMatch = lastPath.match(/^(.*?chapter[-_/]?)(\d+)(\/?)$/i);

  if (!firstMatch || !lastMatch) return sortChapters(found);

  if (firstMatch[1].toLowerCase() !== lastMatch[1].toLowerCase()) {
    return sortChapters(found);
  }

  const firstParsed = new URL(firstUrl);
  const lastParsed = new URL(lastUrl);

  if (firstParsed.origin !== lastParsed.origin) {
    return sortChapters(found);
  }

  const firstNum = Number(firstMatch[2]);
  const lastNum = Number(lastMatch[2]);

  if (
    !Number.isInteger(firstNum) ||
    !Number.isInteger(lastNum) ||
    firstNum < 1 ||
    lastNum < firstNum ||
    lastNum - firstNum > 2000
  ) {
    return sortChapters(found);
  }

  const prefix = firstMatch[1];
  const suffix = firstMatch[3];
  const inferred = [];

  for (let n = firstNum; n <= lastNum; n++) {
    inferred.push({
      url: firstParsed.origin + prefix + n + suffix,
      title: "Chapter " + n
    });
  }

  return inferred.length ? inferred : sortChapters(found);
}

function setDirectoryOptions(items) {
  const select = $("chapterSelect");
  select.innerHTML = "";
  select.add(new Option("请选择起始章节", ""));

  for (const item of items) {
    select.add(new Option(item.title, item.url));
  }
}

$("readDirectoryBtn").addEventListener("click", async function() {
  if (busy) return;

  const url = $("directoryUrl").value.trim();

  if (!url) {
    log("请先填写目录网址。");
    return;
  }

  busy = true;
  $("readDirectoryBtn").disabled = true;

  try {
    log("正在读取目录页面……");

    const doc = await getPage(url);
    const items = findDirectoryChapters(doc, url);

    if (!items.length) {
      log(
        "没有识别到章节链接。\n" +
        "可能是目录结构改变，或网页代理返回的页面不完整。"
      );
      return;
    }

    setDirectoryOptions(items);
    $("chapterSelect").selectedIndex = 1;
    $("startUrl").value = items[0].url;

    log(
      "目录读取完成，共生成 " + items.length + " 个章节地址。\n" +
      "注意：根据首末章节推导出的地址尚未逐一验证。"
    );
  } catch (error) {
    log("读取目录失败：\n" + error.message);
  } finally {
    busy = false;
    $("readDirectoryBtn").disabled = false;
  }
});

$("chapterSelect").addEventListener("change", function() {
  if ($("chapterSelect").value) {
    $("startUrl").value = $("chapterSelect").value;
  }
});

function hasPremium(doc, bodyText) {
  const pageText = doc.body ? doc.body.innerText : "";
  const combined = (bodyText || "") + "\n" + pageText;

  return /###\s*Premium Content/i.test(combined) ||
    /premium content/i.test(combined) ||
    /this chapter is for subscribers only/i.test(combined) ||
    /unlock this chapter/i.test(combined);
}

function extractBody(doc) {
  const selectors = [
    ".contenta",
    ".entry-content",
    ".entry-content-single",
    ".reading-content",
    ".text-left",
    ".chapter-content",
    ".chapter-text",
    ".entry-content-wrap",
    "#chapter-content",
    "#content",
    "article"
  ];

  for (const selector of selectors) {
    const elements = [...doc.querySelectorAll(selector)];

    for (const element of elements) {
      const clone = element.cloneNode(true);

      clone.querySelectorAll(
        "script,style,nav,header,footer,aside,form,button,iframe," +
        ".ads,.advertisement,.sharedaddy,.navigation,.nav-links," +
        ".social-share,.related-posts,.comments"
      ).forEach(node => node.remove());

      const value = (clone.innerText || clone.textContent || "").trim();

      if (value.length > 150) return value;
    }
  }

  if (!doc.body) return "";

  const clone = doc.body.cloneNode(true);

  clone.querySelectorAll(
    "script,style,nav,header,footer,aside,form,button,iframe"
  ).forEach(node => node.remove());

  const value = (clone.innerText || clone.textContent || "").trim();

  return value.length > 150 ? value : "";
}

function extractTitle(doc, fallback) {
  for (const selector of [
    ".entry-title",
    ".chapter-title",
    "h1",
    "h2",
    "title"
  ]) {
    const value = text(doc.querySelector(selector));
    if (value) return value;
  }

  return fallback || "Chapter";
}

function getNextUrl(doc, currentUrl) {
  const relNext = doc.querySelector('a[rel~="next"][href]');

  if (relNext) {
    const href = getAnchorUrl(relNext, currentUrl);
    if (href && sameHost(href, currentUrl)) return href;
  }

  const links = [...doc.querySelectorAll("a[href]")];

  const next = links.find(a =>
    /^(next|next chapter|next page|下一章|下一页)\s*(»|›|→)?$/i.test(text(a))
  );

  if (next) {
    const href = getAnchorUrl(next, currentUrl);
    if (href && sameHost(href, currentUrl)) return href;
  }

  return "";
}

function inferNextChapterUrl(currentUrl) {
  try {
    const u = new URL(currentUrl);
    const match = u.pathname.match(/^(.*?chapter[-_/]?)(\d+)(\/?)$/i);

    if (!match) return "";

    u.pathname = match[1] + (Number(match[2]) + 1) + match[3];

    return u.href;
  } catch {
    return "";
  }
}

function renderChapterList() {
  const container = $("chapterList");
  container.innerHTML = "";

  if (!chapters.length) {
    container.innerHTML = '<p class="small">目前没有抓取到章节。</p>';
    return;
  }

  chapters.forEach((chapter, index) => {
    const row = document.createElement("div");
    row.className = "chapter-item";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.className = "chapter-check";
    checkbox.dataset.index = String(index);
    checkbox.checked = !!chapter.body && !chapter.premium && !chapter.error;

    const content = document.createElement("div");
    content.style.flex = "1";

    const title = document.createElement("span");
    title.textContent = chapter.title +
      (chapter.premium ? "（付费章节）" : "") +
      (chapter.error ? "（失败）" : "");

    content.appendChild(title);

    if (chapter.error) {
      const detail = document.createElement("div");
      detail.className = "small";
      detail.textContent = chapter.error;
      content.appendChild(detail);
    }

    const previewButton = document.createElement("button");
    previewButton.type = "button";
    previewButton.textContent = "预览";
    previewButton.style.width = "72px";
    previewButton.style.minHeight = "34px";
    previewButton.style.padding = "4px";
    previewButton.style.margin = "0";
    previewButton.addEventListener("click", function() {
      showPreview(index);
    });

    row.append(checkbox, content, previewButton);
    container.appendChild(row);
  });
}

function showPreview(index) {
  const chapter = chapters[index];
  if (!chapter) return;

  $("preview").textContent = chapter.body ||
    chapter.error ||
    (chapter.premium ? "检测到付费章节。" : "没有可预览的正文。");

  $("preview").style.fontSize =
    Math.max(12, Math.min(36, Number($("fontSize").value) || 18)) + "px";

  $("preview").style.lineHeight =
    String(Math.max(1, Math.min(3, Number($("lineHeight").value) || 1.8)));
}

$("fontSize").addEventListener("input", function() {
  $("preview").style.fontSize =
    Math.max(12, Math.min(36, Number(this.value) || 18)) + "px";
});

$("lineHeight").addEventListener("input", function() {
  $("preview").style.lineHeight =
    String(Math.max(1, Math.min(3, Number(this.value) || 1.8)));
});

function selectedChapters() {
  const selected = new Set(
    [...document.querySelectorAll(".chapter-check:checked")]
      .map(input => Number(input.dataset.index))
  );

  return chapters.filter((chapter, index) =>
    selected.has(index) &&
    chapter.body &&
    !chapter.premium &&
    !chapter.error
  );
}

$("crawlBtn").addEventListener("click", async function() {
  if (busy) return;

  const start = $("startUrl").value.trim();
  const max = Math.max(1, Math.min(2000, Number($("maxChapters").value) || 100));
  const delay = Math.max(0, Math.min(60000, Number($("delay").value) || 0));

  if (!start) {
    log("请先填写起始章节网址。");
    return;
  }

  try {
    new URL(start);
  } catch {
    log("起始章节网址格式不正确。");
    return;
  }

  busy = true;
  $("crawlBtn").disabled = true;
  chapters = [];
  renderChapterList();

  let currentUrl = start;
  const seen = new Set();
  let stoppedForPremium = false;

  try {
    for (let i = 1; i <= max; i++) {
      if (!currentUrl || seen.has(currentUrl)) {
        log("到达末尾或发现重复网址，停止抓取。");
        break;
      }

      seen.add(currentUrl);
      log("正在抓取第 " + i + " 章：\n" + currentUrl);

      let doc;

      try {
        doc = await getPage(currentUrl);
      } catch (error) {
        chapters.push({
          url: currentUrl,
          title: "Chapter " + i,
          body: "",
          error: error.message
        });

        renderChapterList();
        log("第 " + i + " 章读取失败，已停止抓取。\n" + error.message);
        break;
      }

      /*
       * 付费检测优先。
       * 检测到付费内容时，不调用 getNextUrl，
       * 也不会发送下一章请求。
       */
      if (hasPremium(doc, "")) {
        chapters.push({
          url: currentUrl,
          title: extractTitle(doc, "Chapter " + i),
          body: "",
          premium: true,
          error: ""
        });

        renderChapterList();
        stoppedForPremium = true;

        log(
          "检测到付费章节，已停止抓取。\n" +
          "没有继续请求下一章。\n" + currentUrl
        );
        break;
      }

      const body = extractBody(doc);

      if (!body) {
        chapters.push({
          url: currentUrl,
          title: extractTitle(doc, "Chapter " + i),
          body: "",
          error: "未能识别正文，可能是页面结构变化或访问受限。"
        });

        renderChapterList();

        log(
          "第 " + i + " 章没有识别到正文，已停止抓取。\n" +
          currentUrl
        );
        break;
      }

      chapters.push({
        url: currentUrl,
        title: extractTitle(doc, "Chapter " + i),
        body: body,
        premium: false,
        error: ""
      });

      renderChapterList();

      if (i >= max) {
        log("已达到设定的最大章节数：" + max);
        break;
      }

      let nextUrl = getNextUrl(doc, currentUrl);

      if (!nextUrl) {
        nextUrl = inferNextChapterUrl(currentUrl);
      }

      if (!nextUrl || seen.has(nextUrl)) {
        log("没有找到下一章链接，抓取结束。");
        break;
      }

      currentUrl = nextUrl;

      if (delay > 0) await sleep(delay);
    }

    if (!stoppedForPremium && chapters.some(chapter => chapter.body)) {
      log(
        "抓取结束。成功读取 " +
        chapters.filter(chapter => chapter.body).length +
        " 章正文。"
      );
    }
  } catch (error) {
    log("抓取过程中出现错误：\n" + error.message);
  } finally {
    busy = false;
    $("crawlBtn").disabled = false;
    renderChapterList();
  }
});

$("selectAllBtn").addEventListener("click", function() {
  document.querySelectorAll(".chapter-check").forEach(input => {
    const chapter = chapters[Number(input.dataset.index)];
    input.checked = !!chapter &&
      !!chapter.body &&
      !chapter.premium &&
      !chapter.error;
  });
});

$("selectNoneBtn").addEventListener("click", function() {
  document.querySelectorAll(".chapter-check").forEach(input => {
    input.checked = false;
  });
});

function xmlEscape(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

function htmlEscape(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function chapterXhtml(chapter) {
  const paragraphs = String(chapter.body || "")
    .replace(/\r/g, "")
    .split(/\n+/)
    .map(value => value.trim())
    .filter(Boolean)
    .map(value => "<p>" + htmlEscape(value) + "</p>")
    .join("\n");

  return `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="UTF-8"/>
<title>${xmlEscape(chapter.title)}</title>
<style>
body { font-family: serif; line-height: 1.8; margin: 5%; }
h1 { font-size: 1.4em; text-align: center; margin-bottom: 2em; }
p { text-indent: 1em; margin: 0 0 .8em; }
</style>
</head>
<body>
<h1>${xmlEscape(chapter.title)}</h1>
${paragraphs}
</body>
</html>`;
}

$("exportBtn").addEventListener("click", async function() {
  if (busy) return;

  const selected = selectedChapters();

  if (!selected.length) {
    log("没有选中可导出的正文。请先成功抓取章节并勾选。");
    return;
  }

  if (typeof JSZip === "undefined") {
    log("JSZip 没有加载。请检查网络连接并刷新页面。");
    return;
  }

  busy = true;
  $("exportBtn").disabled = true;

  try {
    log("正在生成 EPUB……");

    const zip = new JSZip();
    const title = $("bookTitle").value.trim() || "Novel";
    const author = $("author").value.trim() || "Unknown";

    zip.file("mimetype", "application/epub+zip", {
      compression: "STORE"
    });

    zip.file("META-INF/container.xml", `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0"
 xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
<rootfiles>
<rootfile full-path="OEBPS/content.opf"
 media-type="application/oebps-package+xml"/>
</rootfiles>
</container>`);

    const manifest = [];
    const spine = [];
    const navItems = [];

    selected.forEach((chapter, index) => {
      const id = "chapter" + (index + 1);
      const filename = id + ".xhtml";

      zip.file("OEBPS/" + filename, chapterXhtml(chapter));

      manifest.push(
        `<item id="${id}" href="${filename}" media-type="application/xhtml+xml"/>`
      );

      spine.push(`<itemref idref="${id}"/>`);

      navItems.push(
        `<li><a href="${filename}">${xmlEscape(chapter.title)}</a></li>`
      );
    });

    zip.file("OEBPS/nav.xhtml", `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
 xmlns:epub="http://www.idpf.org/2007/ops" lang="en">
<head><title>Contents</title><meta charset="UTF-8"/></head>
<body>
<nav epub:type="toc" id="toc">
<h1>Contents</h1>
<ol>${navItems.join("\n")}</ol>
</nav>
</body>
</html>`);

    manifest.push(
      '<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>'
    );

    const identifier =
      "urn:uuid:" +
      (window.crypto && typeof window.crypto.randomUUID === "function"
        ? window.crypto.randomUUID()
        : Date.now() + "-novel");

    zip.file("OEBPS/content.opf", `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf"
 version="3.0" unique-identifier="bookid" xml:lang="en">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="bookid">${xmlEscape(identifier)}</dc:identifier>
<dc:title>${xmlEscape(title)}</dc:title>
<dc:creator>${xmlEscape(author)}</dc:creator>
<dc:language>en</dc:language>
<meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d{3}Z$/, "Z")}</meta>
</metadata>
<manifest>
${manifest.join("\n")}
</manifest>
<spine>
${spine.join("\n")}
</spine>
</package>`);

    const blob = await zip.generateAsync({
      type: "blob",
      mimeType: "application/epub+zip",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    });

    const safeName = title.replace(/[\\/:*?"<>|]+/g, "_").slice(0, 100);
    const downloadUrl = URL.createObjectURL(blob);
    const anchor = document.createElement("a");

    anchor.href = downloadUrl;
    anchor.download = safeName + ".epub";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();

    setTimeout(() => URL.revokeObjectURL(downloadUrl), 30000);

    log("EPUB 已生成，共 " + selected.length + " 章。");
  } catch (error) {
    log("生成 EPUB 失败：\n" + error.message);
  } finally {
    busy = false;
    $("exportBtn").disabled = false;
  }
});

log("页面初始化成功，正在等待操作。");
</script>


<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说章节抓取与 EPUB 导出</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f5f7;
  --panel: #fff;
  --fg: #202124;
  --muted: #666;
  --line: #d9dce1;
  --accent: #2868d7;
}
* { box-sizing: border-box; }
body {
  margin: 0 auto;
  padding: 16px;
  max-width: 900px;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 system-ui, sans-serif;
}
h1 { font-size: 23px; margin: 0 0 12px; }
h2 { font-size: 18px; margin: 20px 0 8px; }
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin: 12px 0;
}
label { display: block; margin: 10px 0 4px; font-weight: 600; }
input, select, textarea, button {
  width: 100%;
  min-height: 42px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 11px;
  background: var(--panel);
  color: var(--fg);
  font: inherit;
}
button {
  cursor: pointer;
  background: var(--accent);
  color: white;
  border: 0;
  font-weight: 600;
  margin-top: 8px;
}
button:disabled { opacity: .5; cursor: wait; }
.row {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.small { color: var(--muted); font-size: 13px; }
#status {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  padding: 10px;
  border-radius: 8px;
  background: var(--bg);
  min-height: 45px;
}
#chapterList {
  max-height: 240px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
}
.chapter-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--line);
}
.chapter-item input { width: 18px; min-height: 18px; margin-top: 5px; }
.chapter-item span { overflow-wrap: anywhere; }
#preview {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 450px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
}
.preview-title { font-weight: 700; margin-bottom: 8px; }
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151619;
    --panel: #202125;
    --fg: #eee;
    --muted: #aaa;
    --line: #3b3d44;
    --accent: #376fd1;
  }
}
</style>
</head>
<body>
<h1>小说章节抓取与 EPUB 导出</h1>
<p class="small">读取小说目录或章节网址，选择起始章节，抓取正文并导出 EPUB。</p>

<div class="panel">
  <h2>1. 小说目录</h2>
  <label for="directoryUrl">目录页网址（可选）</label>
  <input id="directoryUrl" type="url"
    placeholder="https://duskblossoms.com/novel/..."
    value="https://duskblossoms.com/novel/en-travesti-i-became-a-fake-prince/">
  <button id="readDirectoryBtn">读取目录并生成章节列表</button>
  <p class="small">如果目录只显示 Read First / Read Last，会尝试根据首末章节网址推导中间章节。</p>

  <label for="chapterSelect">选择起始章节</label>
  <select id="chapterSelect">
    <option value="">也可以直接填写下面的章节网址</option>
  </select>

  <label for="startUrl">起始章节网址</label>
  <input id="startUrl" type="url"
    placeholder="https://example.com/chapter-1/">
  <div class="row">
    <div>
      <label for="maxChapters">最多抓取章节数</label>
      <input id="maxChapters" type="number" min="1" max="2000" value="100">
    </div>
    <div>
      <label for="delay">每章间隔（毫秒）</label>
      <input id="delay" type="number" min="0" max="60000" value="1200">
    </div>
  </div>
  <button id="crawlBtn">开始抓取章节</button>
</div>

<div class="panel">
  <h2>2. 章节列表</h2>
  <div class="row">
    <button id="selectAllBtn" type="button">全选章节</button>
    <button id="selectNoneBtn" type="button">取消全选</button>
  </div>
  <div id="chapterList">
    <p class="small">读取目录或开始抓取后，章节会显示在这里。</p>
  </div>
  <p class="small">付费章节会标记出来。遇到付费章节后，抓取过程会停止，不再请求后面的章节。</p>
</div>

<div class="panel">
  <h2>3. 正文预览</h2>
  <div class="row">
    <div>
      <label for="fontSize">字体大小（px）</label>
      <input id="fontSize" type="number" min="12" max="36" value="18">
    </div>
    <div>
      <label for="lineHeight">行高</label>
      <input id="lineHeight" type="number" min="1" max="3" step="0.1" value="1.8">
    </div>
  </div>
  <div id="preview" style="font-size:18px;line-height:1.8">
    抓取完成后，点击章节列表中的预览按钮查看正文。
  </div>
</div>

<div class="panel">
  <h2>4. 导出 EPUB</h2>
  <label for="bookTitle">书名</label>
  <input id="bookTitle" value="En Travesti, I Became a Fake Prince">
  <label for="author">作者（可选）</label>
  <input id="author" placeholder="作者名">
  <button id="exportBtn">导出选中的章节为 EPUB</button>
  <p class="small">导出需要加载 JSZip。首次使用时请保持网络连接。</p>
</div>

<div class="panel">
  <h2>运行状态</h2>
  <div id="status">就绪。</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
"use strict";

const $ = id => document.getElementById(id);

let chapters = [];
let directoryItems = [];
let busy = false;

function log(message) {
  $("status").textContent = message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function cleanText(value) {
  return (value || "").replace(/\s+/g, " ").trim();
}

function text(element) {
  return cleanText(element ? element.textContent : "");
}

function absolute(href, base) {
  if (!href) return "";
  try {
    return new URL(href, base).href;
  } catch {
    return "";
  }
}

function sameHost(a, b) {
  try {
    return new URL(a).hostname === new URL(b).hostname;
  } catch {
    return false;
  }
}

/*
 * 通过代理读取网页。
 * 如果你使用的代理服务网址有变化，只需要修改这里。
 */
async function getPage(url) {
  const proxyUrl = "https://corsproxy.nl/?url=" + encodeURIComponent(url);
  const response = await fetch(proxyUrl, {
    method: "GET",
    cache: "no-store"
  });

  if (!response.ok) {
    throw new Error("网页请求失败，HTTP " + response.status);
  }

  const html = await response.text();

  if (!html || html.length < 100) {
    throw new Error("返回内容为空或过短，可能是代理或网站拦截。");
  }

  return new DOMParser().parseFromString(html, "text/html");
}

function getAnchorUrl(anchor, base) {
  return absolute(anchor.getAttribute("href"), base);
}

function isReadFirst(anchor) {
  return /^read\s+first$/i.test(text(anchor));
}

function isReadLast(anchor) {
  return /^read\s+last$/i.test(text(anchor));
}

/*
 * 从目录页面识别章节。
 * 若页面只有 Read First / Read Last，则根据两个链接的 URL 规律补全章节地址。
 */
function findDirectoryChapters(doc, directoryUrl) {
  const directory = new URL(directoryUrl);
  const links = [...doc.querySelectorAll("a[href]")];
  const found = [];
  const seen = new Set();

  for (const a of links) {
    if (isReadFirst(a) || isReadLast(a)) continue;

    const href = getAnchorUrl(a, directoryUrl);
    if (!href || seen.has(href)) continue;

    let u;
    try {
      u = new URL(href);
    } catch {
      continue;
    }

    if (u.hostname !== directory.hostname) continue;

    const label = text(a);
    const looksLikeChapter =
      /chapter/i.test(u.pathname) ||
      /\bchapter\s*[\d:.-]+/i.test(label) ||
      /第\s*\d+\s*章/.test(label);

    if (!looksLikeChapter) continue;
    if (/\/(tag|category|author|login|register)\//i.test(u.pathname)) continue;

    seen.add(href);
    found.push({ url: href, title: label || u.pathname });
  }

  if (found.length > 2) {
    return sortChapters(found);
  }

  const firstLink = links.find(isReadFirst);
  const lastLink = links.find(isReadLast);

  if (!firstLink || !lastLink) return sortChapters(found);

  const firstUrl = getAnchorUrl(firstLink, directoryUrl);
  const lastUrl = getAnchorUrl(lastLink, directoryUrl);

  if (!firstUrl || !lastUrl) return sortChapters(found);

  let firstPath, lastPath;
  try {
    firstPath = new URL(firstUrl).pathname;
    lastPath = new URL(lastUrl).pathname;
  } catch {
    return sortChapters(found);
  }

  const firstMatch = firstPath.match(/^(.*?chapter[-_/]?)(\d+)(\/?)$/i);
  const lastMatch = lastPath.match(/^(.*?chapter[-_/]?)(\d+)(\/?)$/i);

  if (!firstMatch || !lastMatch) return sortChapters(found);

  if (firstMatch[1].toLowerCase() !== lastMatch[1].toLowerCase()) {
    return sortChapters(found);
  }

  if (new URL(firstUrl).origin !== new URL(lastUrl).origin) {
    return sortChapters(found);
  }

  const firstNum = Number(firstMatch[2]);
  const lastNum = Number(lastMatch[2]);

  if (
    !Number.isInteger(firstNum) ||
    !Number.isInteger(lastNum) ||
    firstNum < 1 ||
    lastNum < firstNum ||
    lastNum - firstNum > 2000
  ) {
    return sortChapters(found);
  }

  const base = new URL(firstUrl);
  const prefix = firstMatch[1];
  const suffix = firstMatch[3];

  const inferred = [];

  for (let n = firstNum; n <= lastNum; n++) {
    inferred.push({
      url: base.origin + prefix + n + suffix,
      title: "Chapter " + n
    });
  }

  return inferred.length ? inferred : sortChapters(found);
}

function sortChapters(items) {
  return items.sort((a, b) => {
    const na = chapterNumber(a.title || a.url);
    const nb = chapterNumber(b.title || b.url);
    if (na !== null && nb !== null) return na - nb;
    return (a.title || "").localeCompare(b.title || "");
  });
}

function chapterNumber(value) {
  const s = String(value || "");
  const matches = [
    s.match(/chapter[-_\s]*(\d+)/i),
    s.match(/第\s*(\d+)\s*章/i),
    s.match(/(?:^|\s)(\d+)(?:\s|$)/)
  ];
  for (const match of matches) {
    if (match) return Number(match[1]);
  }
  return null;
}

function setDirectoryOptions(items) {
  const select = $("chapterSelect");
  select.innerHTML = "";
  select.add(new Option("请选择起始章节", ""));

  for (const item of items) {
    const option = new Option(item.title, item.url);
    option.dataset.url = item.url;
    select.add(option);
  }
}

function renderChapterList() {
  const container = $("chapterList");
  container.innerHTML = "";

  if (!chapters.length) {
    container.innerHTML = '<p class="small">目前没有抓取到章节。</p>';
    return;
  }

  chapters.forEach((chapter, index) => {
    const row = document.createElement("div");
    row.className = "chapter-item";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = !chapter.premium && !chapter.error;
    checkbox.dataset.index = String(index);
    checkbox.className = "chapter-check";

    const content = document.createElement("div");
    content.style.flex = "1";

    const title = document.createElement("span");
    title.textContent =
      chapter.title +
      (chapter.premium ? "（付费章节）" : "") +
      (chapter.error ? "（抓取失败）" : "");

    content.appendChild(title);

    if (chapter.error) {
      const errorText = document.createElement("div");
      errorText.className = "small";
      errorText.textContent = chapter.error;
      content.appendChild(errorText);
    }

    const previewButton = document.createElement("button");
    previewButton.type = "button";
    previewButton.textContent = "预览";
    previewButton.style.width = "72px";
    previewButton.style.minHeight = "34px";
    previewButton.style.padding = "4px";
    previewButton.style.margin = "0";
    previewButton.addEventListener("click", () => showPreview(index));

    row.append(checkbox, content, previewButton);
    container.appendChild(row);
  });
}

function selectedChapters() {
  const selected = new Set(
    [...document.querySelectorAll(".chapter-check:checked")]
      .map(input => Number(input.dataset.index))
  );

  return chapters.filter((chapter, index) =>
    selected.has(index) &&
    chapter.body &&
    !chapter.premium &&
    !chapter.error
  );
}

function showPreview(index) {
  const chapter = chapters[index];
  if (!chapter) return;

  $("preview").textContent = chapter.body || chapter.error ||
    (chapter.premium ? "检测到付费章节。" : "没有可预览的正文。");

  $("preview").style.fontSize = Number($("fontSize").value || 18) + "px";
  $("preview").style.lineHeight = String(Number($("lineHeight").value || 1.8));
}

$("fontSize").addEventListener("input", () => {
  $("preview").style.fontSize = Number($("fontSize").value || 18) + "px";
});

$("lineHeight").addEventListener("input", () => {
  $("preview").style.lineHeight = String(Number($("lineHeight").value || 1.8));
});

$("chapterSelect").addEventListener("change", () => {
  if ($("chapterSelect").value) {
    $("startUrl").value = $("chapterSelect").value;
  }
});

$("readDirectoryBtn").addEventListener("click", async () => {
  if (busy) return;

  const url = $("directoryUrl").value.trim();
  if (!url) {
    log("请先填写目录网址。");
    return;
  }

  busy = true;
  $("readDirectoryBtn").disabled = true;

  try {
    log("正在读取目录页面……");
    const doc = await getPage(url);
    const items = findDirectoryChapters(doc, url);

    if (!items.length) {
      log(
        "没有识别到章节链接。\n" +
        "可能原因：代理无法访问网站、网站修改了链接结构，或目录没有 Read First / Read Last。"
      );
      return;
    }

    directoryItems = items;
    setDirectoryOptions(items);

    if (items.length) {
      $("chapterSelect").selectedIndex = 1;
      $("startUrl").value = items[0].url;
    }

    log(
      "目录读取完成，共生成 " + items.length + " 个章节地址。\n" +
      "请注意：如果这些地址是根据 Read First / Read Last 推导出来的，尚未逐一验证页面是否存在。"
    );
  } catch (error) {
    log("读取目录失败：" + error.message);
  } finally {
    busy = false;
    $("readDirectoryBtn").disabled = false;
  }
});

/*
 * 识别常见付费章节标记。
 * 遇到付费章节时，抓取流程会停止，不再读取下一章。
 */
function hasPremium(doc, bodyText) {
  const combined = (bodyText || "") + "\n" + (doc.body?.innerText || "");
  return /###\s*Premium Content/i.test(combined) ||
    /premium content/i.test(combined) ||
    /this chapter is for subscribers only/i.test(combined) ||
    /unlock this chapter/i.test(combined);
}

function extractBody(doc) {
  const selectors = [
    ".contenta",
    ".entry-content",
    ".entry-content-single",
    ".reading-content",
    ".text-left",
    ".chapter-content",
    ".chapter-text",
    ".entry-content-wrap",
    "#chapter-content",
    "#content",
    "article"
  ];

  for (const selector of selectors) {
    const elements = [...doc.querySelectorAll(selector)];
    for (const element of elements) {
      const clone = element.cloneNode(true);

      clone.querySelectorAll(
        "script,style,nav,header,footer,aside,form,button,iframe," +
        ".ads,.advertisement,.sharedaddy,.navigation,.nav-links," +
        ".social-share,.related-posts,.comments"
      ).forEach(node => node.remove());

      const value = (clone.innerText || clone.textContent || "").trim();
      if (value.length > 150) {
        return value;
      }
    }
  }

  const article = doc.body;
  if (!article) return "";

  const clone = article.cloneNode(true);
  clone.querySelectorAll(
    "script,style,nav,header,footer,aside,form,button,iframe"
  ).forEach(node => node.remove());

  const value = (clone.innerText || clone.textContent || "").trim();
  return value.length > 150 ? value : "";
}

function extractTitle(doc, fallback) {
  const selectors = [
    ".entry-title",
    ".chapter-title",
    "h1",
    "h2",
    "title"
  ];

  for (const selector of selectors) {
    const element = doc.querySelector(selector);
    const value = text(element);
    if (value) return value;
  }

  return fallback || "Chapter";
}

function getNextUrl(doc, currentUrl) {
  const links = [...doc.querySelectorAll("a[href]")];

  const relNext = doc.querySelector('a[rel~="next"][href]');
  if (relNext) {
    const href = getAnchorUrl(relNext, currentUrl);
    if (href && sameHost(href, currentUrl)) return href;
  }

  const candidates = links.map(a => ({
    a,
    label: text(a),
    href: getAnchorUrl(a, currentUrl)
  })).filter(item =>
    item.href &&
    sameHost(item.href, currentUrl) &&
    !/previous|prev chapter|上一章/i.test(item.label)
  );

  const next = candidates.find(item =>
    /^(next|next chapter|next page|下一章|下一页)\s*(»|›|→)?$/i.test(item.label)
  );

  if (next) return next.href;

  const ariaNext = links.find(item => {
    const aria = item.getAttribute("aria-label") || "";
    return /next chapter|next page/i.test(aria);
  });

  if (ariaNext) {
    const href = getAnchorUrl(ariaNext, currentUrl);
    if (href && sameHost(href, currentUrl)) return href;
  }

  return "";
}

function inferNextChapterUrl(currentUrl) {
  try {
    const u = new URL(currentUrl);
    const match = u.pathname.match(/^(.*?chapter[-_/]?)(\d+)(\/?)$/i);
    if (!match) return "";

    const nextNumber = Number(match[2]) + 1;
    u.pathname = match[1] + nextNumber + match[3];
    return u.href;
  } catch {
    return "";
  }
}

function makeChapterTitle(doc, url, index) {
  const title = extractTitle(doc, "Chapter " + index);
  return title || ("Chapter " + index);
}

$("crawlBtn").addEventListener("click", async () => {
  if (busy) return;

  const start = $("startUrl").value.trim();
  const max = Math.max(1, Math.min(2000, Number($("maxChapters").value) || 100));
  const delay = Math.max(0, Math.min(60000, Number($("delay").value) || 0));

  if (!start) {
    log("请填写起始章节网址，或先读取目录。");
    return;
  }

  busy = true;
  $("crawlBtn").disabled = true;
  chapters = [];
  renderChapterList();

  let currentUrl = start;
  const seen = new Set();
  let stoppedForPremium = false;

  try {
    for (let i = 1; i <= max; i++) {
      if (!currentUrl || seen.has(currentUrl)) {
        log("已到达最后一章，或检测到重复网址，停止抓取。");
        break;
      }

      seen.add(currentUrl);
      log("正在抓取第 " + i + " 章：\n" + currentUrl);

      let doc;
      try {
        doc = await getPage(currentUrl);
      } catch (error) {
        chapters.push({
          url: currentUrl,
          title: "Chapter " + i,
          body: "",
          error: error.message
        });
        renderChapterList();
        log("第 " + i + " 章读取失败，已停止抓取。\n" + error.message);
        break;
      }

      /*
       * 先检测整页付费标记，再提取正文。
       * 一旦检测到付费章节，不再调用 getNextUrl，也不再请求下一章。
       */
      const paid = hasPremium(doc, "");
      const body = extractBody(doc);

      if (paid || !body) {
        chapters.push({
          url: currentUrl,
          title: extractTitle(doc, "Chapter " + i),
          body: "",
          premium: paid,
          error: !paid ? "未能识别正文，可能是页面结构变化或访问受限。" : ""
        });

        renderChapterList();

        if (paid) {
          stoppedForPremium = true;
          log(
            "检测到付费章节，已停止抓取。\n" +
            "不会继续请求下一章。\n" + currentUrl
          );
        } else {
          log(
            "第 " + i + " 章没有识别到正文，已停止。\n" +
            "请检查页面结构或代理访问情况。\n" + currentUrl
          );
        }
        break;
      }

      const title = makeChapterTitle(doc, currentUrl, i);

      chapters.push({
        url: currentUrl,
        title,
        body,
        premium: false,
        error: ""
      });

      renderChapterList();

      if (i >= max) {
        log("已达到设定的最大章节数：" + max);
        break;
      }

      /*
       * 只有当前章节成功读取且不是付费章节时，
       * 才寻找下一章链接；若页面没有 Next 链接，则尝试数字递增。
       */
      let nextUrl = getNextUrl(doc, currentUrl);

      if (!nextUrl) {
        nextUrl = inferNextChapterUrl(currentUrl);
      }

      if (!nextUrl || seen.has(nextUrl)) {
        log("没有找到下一章链接，抓取结束。");
        break;
      }

      currentUrl = nextUrl;
      if (delay > 0) await sleep(delay);
    }

    if (!stoppedForPremium && chapters.some(c => c.body)) {
      log(
        "抓取完成，共读取 " +
        chapters.filter(c => c.body).length +
        " 章正文。"
      );
    }
  } catch (error) {
    log("抓取过程中出现错误：" + error.message);
  } finally {
    busy = false;
    $("crawlBtn").disabled = false;
    renderChapterList();
  }
});

$("selectAllBtn").addEventListener("click", () => {
  document.querySelectorAll(".chapter-check").forEach(input => {
    const chapter = chapters[Number(input.dataset.index)];
    input.checked = !!chapter && !!chapter.body &&
      !chapter.premium && !chapter.error;
  });
});

$("selectNoneBtn").addEventListener("click", () => {
  document.querySelectorAll(".chapter-check").forEach(input => {
    input.checked = false;
  });
});

function xmlEscape(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&apos;");
}

function htmlEscape(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function chapterXhtml(chapter) {
  const paragraphs = String(chapter.body || "")
    .replace(/\r/g, "")
    .split(/\n+/)
    .map(s => s.trim())
    .filter(Boolean)
    .map(s => "<p>" + htmlEscape(s) + "</p>")
    .join("\n");

  return `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="UTF-8"/>
<title>${xmlEscape(chapter.title)}</title>
<style>
body { font-family: serif; line-height: 1.8; margin: 5%; }
h1 { font-size: 1.4em; text-align: center; margin-bottom: 2em; }
p { text-indent: 1em; margin: 0 0 0.8em; }
</style>
</head>
<body>
<h1>${xmlEscape(chapter.title)}</h1>
${paragraphs}
</body>
</html>`;
}

$("exportBtn").addEventListener("click", async () => {
  if (busy) return;

  const selected = selectedChapters();

  if (!selected.length) {
    log("没有选中可导出的正文章节。请勾选至少一章已成功抓取的章节。");
    return;
  }

  if (typeof JSZip === "undefined") {
    log("JSZip 未加载。请检查网络连接后刷新页面再试。");
    return;
  }

  busy = true;
  $("exportBtn").disabled = true;

  try {
    log("正在生成 EPUB……");

    const zip = new JSZip();
    const title = $("bookTitle").value.trim() || "Novel";
    const author = $("author").value.trim() || "Unknown";

    zip.file("mimetype", "application/epub+zip", {
      compression: "STORE"
    });

    zip.file("META-INF/container.xml", `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
<rootfiles>
<rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
</rootfiles>
</container>`);

    const manifest = [];
    const spine = [];
    const navItems = [];

    selected.forEach((chapter, index) => {
      const id = "chapter" + (index + 1);
      const filename = id + ".xhtml";

      zip.file("OEBPS/" + filename, chapterXhtml(chapter));

      manifest.push(
        `<item id="${id}" href="${filename}" media-type="application/xhtml+xml"/>`
      );

      spine.push(`<itemref idref="${id}"/>`);

      navItems.push(
        `<li><a href="${filename}">${xmlEscape(chapter.title)}</a></li>`
      );
    });

    zip.file("OEBPS/nav.xhtml", `<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:epub="http://www.idpf.org/2007/ops" lang="en">
<head><title>Contents</title><meta charset="UTF-8"/></head>
<body>
<nav epub:type="toc" id="toc">
<h1>Contents</h1>
<ol>${navItems.join("\n")}</ol>
</nav>
</body>
</html>`);

    manifest.push(
      '<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>'
    );

    zip.file("OEBPS/content.opf", `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf"
         version="3.0" unique-identifier="bookid" xml:lang="en">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="bookid">urn:uuid:${crypto.randomUUID ?
      crypto.randomUUID() :
      Date.now() + "-novel"}</dc:identifier>
<dc:title>${xmlEscape(title)}</dc:title>
<dc:creator>${xmlEscape(author)}</dc:creator>
<dc:language>en</dc:language>
<meta property="dcterms:modified">${new Date().toISOString().replace(/\.\d{3}Z$/, "Z")}</meta>
</metadata>
<manifest>
${manifest.join("\n")}
</manifest>
<spine>
${spine.join("\n")}
</spine>
</package>`);

    const blob = await zip.generateAsync({
      type: "blob",
      mimeType: "application/epub+zip",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    });

    const safeName = title.replace(/[\\/:*?"<>|]+/g, "_").slice(0, 100);
    const downloadUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = downloadUrl;
    a.download = safeName + ".epub";
    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(downloadUrl), 30000);

    log("EPUB 已生成，共 " + selected.length + " 章。");
  } catch (error) {
    log("生成 EPUB 失败：" + error.message);
  } finally {
    busy = false;
    $("exportBtn").disabled = false;
  }
});
</script>
</body>
</html>

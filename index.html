<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说章节抓取测试</title>
<style>
body {
  font-family: system-ui, sans-serif;
  max-width: 760px;
  margin: auto;
  padding: 18px;
  line-height: 1.6;
}
input, textarea, button {
  box-sizing: border-box;
  width: 100%;
  margin: 6px 0 12px;
  padding: 12px;
  font-size: 16px;
}
button { cursor: pointer; }
#status { white-space: pre-wrap; }
#preview {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  border: 1px solid #ccc;
  padding: 12px;
  min-height: 120px;
}
</style>
</head>
<body>
<h2>小说章节抓取测试</h2>

<label for="url">章节网址</label>
<input id="url" type="url"
  value="https://shanghaifantasy.com/my-blind-date-was-snatched-away-my-arch-rivals-brother-calls-me-baby-chapter-1/"
  placeholder="粘贴小说章节网址">

<button id="fetchBtn">抓取章节</button>
<p id="status">等待抓取。</p>

<h3>正文预览</h3>
<div id="preview">抓取成功后，正文会显示在这里。</div>

<button id="downloadBtn" disabled>下载 TXT</button>

<script>
const $ = id => document.getElementById(id);
let chapterText = "";
let chapterTitle = "novel-chapter";

function getTitle(doc) {
  const h = doc.querySelector(
    "h1.entry-title, h1, article h2"
  );
  return h?.textContent?.trim() ||
         doc.title?.trim() ||
         "小说章节";
}

function extractContent(doc) {
  const selectors = [
    ".entry-content",
    ".post-content",
    ".article-content",
    ".chapter-content",
    "article"
  ];

  for (const selector of selectors) {
    const el = doc.querySelector(selector);
    if (!el) continue;

    const clone = el.cloneNode(true);
    clone.querySelectorAll(
      "script, style, nav, header, footer, " +
      "button, form, .sharedaddy, .jp-relatedposts"
    ).forEach(node => node.remove());

    const text = clone.innerText || clone.textContent || "";
    const cleaned = text
      .replace(/\r/g, "")
      .replace(/[ \t]+\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();

    if (cleaned.length > 300) return cleaned;
  }

  return "";
}

$("fetchBtn").addEventListener("click", async () => {
  const url = $("url").value.trim();

  if (!url) {
    $("status").textContent = "请先输入章节网址。";
    return;
  }

  let parsed;
  try {
    parsed = new URL(url);
    if (parsed.protocol !== "https:" &&
        parsed.protocol !== "http:") {
      throw new Error("网址格式不正确");
    }
  } catch {
    $("status").textContent = "网址无效，请检查后重试。";
    return;
  }

  $("fetchBtn").disabled = true;
  $("downloadBtn").disabled = true;
  $("status").textContent = "正在抓取，请稍候……";
  $("preview").textContent = "";
  chapterText = "";

  try {
    // 使用已测试成功的公共 CORS 代理
    const proxyUrl =
      "https://corsproxy.nl/" +
      url.replace(/^https?:\/\//i, "");

    const response = await fetch(proxyUrl);

    if (!response.ok) {
      throw new Error("代理返回 HTTP " + response.status);
    }

    const html = await response.text();
    const doc = new DOMParser().parseFromString(
      html, "text/html"
    );

    chapterTitle = getTitle(doc);
    chapterText = extractContent(doc);

    if (!chapterText) {
      throw new Error(
        "网页已返回，但没有找到正文。可能需要调整正文提取规则。"
      );
    }

    $("preview").textContent =
      chapterTitle + "\n\n" + chapterText;

    $("status").textContent =
      "抓取成功！正文约 " +
      chapterText.length + " 个字符。";

    $("downloadBtn").disabled = false;
  } catch (error) {
    $("status").textContent =
      "抓取失败：" + error.message +
      "\n\n请稍后重试，或检查该网站是否限制了代理访问。";
  } finally {
    $("fetchBtn").disabled = false;
  }
});

$("downloadBtn").addEventListener("click", () => {
  const blob = new Blob(
    [chapterTitle + "\n\n" + chapterText],
    { type: "text/plain;charset=utf-8" }
  );

  const link = document.createElement("a");
  const objectUrl = URL.createObjectURL(blob);

  link.href = objectUrl;
  link.download = (chapterTitle || "novel-chapter")
    .replace(/[\\/:*?"<>|]/g, "_") + ".txt";

  link.click();
  setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
});
</script>
</body>
</html>

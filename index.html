
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小说转 EPUB</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}
body{max-width:950px;margin:0 auto;padding:18px;line-height:1.6}
h1{font-size:1.65rem;margin-bottom:4px}
.note{opacity:.75;font-size:.9rem}
input,textarea,select,button{font:inherit;box-sizing:border-box}
input,textarea,select{width:100%;padding:10px;margin:5px 0 12px;border:1px solid #8888;border-radius:8px}
button{padding:9px 14px;border:1px solid #8888;border-radius:8px;cursor:pointer;margin:3px}
button.primary{background:#2867d7;color:white;border-color:#2867d7}
button:disabled{opacity:.45;cursor:not-allowed}
.panel{border:1px solid #8885;border-radius:12px;padding:15px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chapter-list{max-height:420px;overflow:auto;border:1px solid #8885;border-radius:8px}
.chapter{padding:8px 10px;border-bottom:1px solid #8883;display:flex;gap:9px;align-items:flex-start}
.chapter:last-child{border-bottom:0}
.chapter input{width:auto;margin:5px 0 0}
.chapter-title{overflow-wrap:anywhere;flex:1}
.status{font-size:.82rem;opacity:.8}
.paid{color:#d97706}
.good{color:#16a34a}
.bad{color:#dc2626}
#preview{white-space:normal;overflow-wrap:anywhere;max-height:550px;overflow:auto;border:1px solid #8885;border-radius:8px;padding:18px}
#preview img{max-width:100%;height:auto}
.progress{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9rem}
@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>
<h1>小说转 EPUB</h1>
<p class="note">输入小说目录网址，自动识别章节、跳过付费内容并生成 EPUB。适用于上海幻想网等结构相近的网站。</p>

<div class="panel">
<label for="catalog"><b>小说目录网址</b></label>
<input id="catalog" value="https://shanghaifantasy.com/novel/my-blind-date-was-snatched-away-my-arch-rivals-brother-calls-me-baby/" placeholder="粘贴小说目录网址">
<button class="primary" id="findBtn">① 读取目录</button>
<div id="log" class="progress" aria-live="polite"></div>
</div>

<div class="panel">
<h3>书籍信息</h3>
<div class="grid">
<div><label for="bookTitle">书名</label><input id="bookTitle" value="My Blind Date Was Snatched Away? My Arch-Rival’s Brother Calls Me Baby"></div>
<div><label for="author">作者</label><input id="author" placeholder="可留空"></div>
<div><label for="language">语言</label><select id="language"><option value="en">English</option><option value="zh">简体中文</option><option value="ja">日本語</option></select></div>
<div><label for="fontSize">字体大小</label><select id="fontSize"><option value="90%">90%</option><option value="100%" selected>100%</option><option value="110%">110%</option><option value="120%">120%</option><option value="130%">130%</option><option value="140%">140%</option></select></div>
<div><label for="lineHeight">行距</label><select id="lineHeight"><option value="1.4">1.4</option><option value="1.6" selected>1.6</option><option value="1.8">1.8</option><option value="2">2.0</option><option value="2.2">2.2</option></select></div>
</div>
</div>

<div class="panel">
<h3>章节列表</h3>
<p class="note">识别到的付费章节会自动跳过。你也可以手动取消勾选不需要的章节。</p>
<div>
<button id="selectAll" disabled>全选免费章节</button>
<button id="selectNone" disabled>全部取消</button>
<button id="downloadBtn" class="primary" disabled>② 抓取选中章节</button>
</div>
<div id="chapters" class="chapter-list"><div class="chapter">请先读取目录。</div></div>
</div>

<div class="panel">
<h3>正文预览</h3>
<label for="previewSelect">选择已抓取章节</label>
<select id="previewSelect" disabled><option>暂无已抓取章节</option></select>
<div id="preview">抓取完成后在这里预览。</div>
</div>

<div class="panel">
<h3>生成 EPUB</h3>
<p id="summary" class="note">尚未抓取章节。</p>
<button id="epubBtn" class="primary" disabled>③ 生成并下载 EPUB</button>
<div id="epubStatus" class="progress"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const state = {
  chapters: [],
  downloaded: [],
  busy: false
};

const CORS = "https://corsproxy.nl/";
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function log(message) {
  $("log").textContent = message;
}
function safeText(el) {
  return (el?.innerText || el?.textContent || "").replace(/\s+/g, " ").trim();
}
function absoluteURL(href, base) {
  try {
    const u = new URL(href, base);
    if (!/^https?:$/.test(u.protocol)) return null;
    u.hash = "";
    return u.href;
  } catch {
    return null;
  }
}
function proxyURL(url) {
  return CORS + url.replace(/^https?:\/\//i, "");
}
async function getHTML(url) {
  const response = await fetch(proxyURL(url), {cache:"no-store"});
  if (!response.ok) throw new Error("HTTP " + response.status);
  const text = await response.text();
  if (!text || text.length < 500) throw new Error("网页内容为空或过短");
  return new DOMParser().parseFromString(text, "text/html");
}
function chapterNumber(text, url) {
  const s = (text || "") + " " + (url || "");
  const m = s.match(/chapter[\s-]*(\d+)/i) ||
            s.match(/第\s*(\d+)\s*章/);
  return m ? Number(m[1]) : null;
}
function isChapterURL(url) {
  try {
    const u = new URL(url);
    return /chapter[-_/ ]*\d+/i.test(u.pathname) ||
           /chapter-\d+/i.test(u.pathname);
  } catch {
    return false;
  }
}
function paidByMarker(text) {
  return /\b\d+\s*coins?\b/i.test(text) ||
         /\b\d+\s*coin\b/i.test(text) ||
         /###\s*Premium\s*Content/i.test(text) ||
         /\bPremium\s+Content\b/i.test(text);
}

/*
 * 找到章节链接所在的目录卡片。
 * 只有章节卡片内部独立的数字元素（如单独显示的 12）
 * 才会被作为 coin 付费标记；不会把标题里的 Chapter 32
 * 当成价格。
 */
function cardInfo(anchor) {
  const anchorText = safeText(anchor);
  let node = anchor;
  let best = anchor.parentElement || anchor;
  let bestScore = Infinity;

  for (let depth = 0; depth < 6 && node?.parentElement; depth++) {
    node = node.parentElement;
    const links = [...node.querySelectorAll("a[href]")];
    const chapterLinks = links.filter(a =>
      isChapterURL(absoluteURL(a.getAttribute("href"), location.href) || "")
    );
    if (chapterLinks.length > 1) break;

    const text = safeText(node);
    if (text.length > 900) break;

    const score = text.length;
    if (score >= anchorText.length && score < bestScore) {
      best = node;
      bestScore = score;
    }
  }

  const cardText = safeText(best);
  const directNumber = [...best.querySelectorAll("*")].some(el => {
    if (el.children.length > 0) return false;
    const t = safeText(el);
    if (!/^\d{1,4}$/.test(t)) return false;
    // 排除数字若只是章节标题本身的一部分
    return !anchor.contains(el) && !el.closest("a");
  });

  const paid = paidByMarker(cardText) || directNumber;
  return {cardText, paid};
}

function extractCatalog(doc, catalogURL) {
  const anchors = [...doc.querySelectorAll("a[href]")];
  const seen = new Set();
  const list = [];

  for (const a of anchors) {
    const url = absoluteURL(a.getAttribute("href"), catalogURL);
    if (!url || !isChapterURL(url) || seen.has(url)) continue;

    const title = safeText(a);
    if (!title || title.length < 5) continue;
    seen.add(url);

    const info = cardInfo(a);
    const num = chapterNumber(title, url);
    list.push({
      url,
      title,
      num,
      paid: info.paid,
      status: info.paid ? "付费已跳过" : "待抓取",
      html: "",
      text: ""
    });
  }

  list.sort((a, b) => {
    if (a.num != null && b.num != null && a.num !== b.num)
      return a.num - b.num;
    if (a.num != null && b.num == null) return -1;
    if (a.num == null && b.num != null) return 1;
    return 0;
  });
  return list;
}

function renderChapters() {
  const root = $("chapters");
  root.replaceChildren();

  if (!state.chapters.length) {
    root.textContent = "没有找到章节链接。";
    $("downloadBtn").disabled = true;
    $("selectAll").disabled = true;
    $("selectNone").disabled = true;
    return;
  }

  state.chapters.forEach((ch, i) => {
    const row = document.createElement("div");
    row.className = "chapter";

    const check = document.createElement("input");
    check.type = "checkbox";
    check.checked = !ch.paid && ch.status !== "失败";
    check.disabled = ch.paid;
    check.setAttribute("aria-label", "选择 " + ch.title);
    check.addEventListener("change", () => {
      ch.selected = check.checked;
      updateSummary();
    });

    const content = document.createElement("div");
    content.className = "chapter-title";

    const title = document.createElement("div");
    title.textContent = ch.title;

    const status = document.createElement("div");
    status.className = "status " + (ch.paid ? "paid" : ch.status === "成功" ? "good" : ch.status === "失败" ? "bad" : "");
    status.textContent = ch.status;

    content.append(title, status);
    row.append(check, content);
    root.append(row);

    ch.selected = check.checked;
  });

  $("downloadBtn").disabled = false;
  $("selectAll").disabled = false;
  $("selectNone").disabled = false;
  updateSummary();
}

function updateSummary() {
  const free = state.chapters.filter(c => !c.paid);
  const selected = free.filter(c => c.selected);
  const fetched = state.downloaded.length;
  const skipped = state.chapters.filter(c => c.paid).length;
  $("summary").textContent =
    `目录章节：${state.chapters.length}；付费跳过：${skipped}；免费/待确认：${free.length}；已抓取正文：${fetched}；当前勾选：${selected.length}。`;
  $("epubBtn").disabled = !state.downloaded.some(c => c.text && !c.paid);
}

$("selectAll").addEventListener("click", () => {
  state.chapters.forEach(c => { if (!c.paid) c.selected = true; });
  renderChapters();
});
$("selectNone").addEventListener("click", () => {
  state.chapters.forEach(c => c.selected = false);
  renderChapters();
});

$("findBtn").addEventListener("click", async () => {
  if (state.busy) return;
  const url = absoluteURL($("catalog").value.trim(), location.href);
  if (!url) return log("请输入有效的 http/https 目录网址。");

  state.busy = true;
  $("findBtn").disabled = true;
  log("正在读取目录页……");
  try {
    const doc = await getHTML(url);
    const list = extractCatalog(doc, url);

    if (!list.length) {
      throw new Error("没有识别到章节链接。可能是目录结构发生变化，或代理返回的页面不是目录。");
    }

    state.chapters = list;
    state.downloaded = [];
    $("preview").textContent = "抓取完成后在这里预览。";
    $("previewSelect").replaceChildren();
    $("previewSelect").disabled = true;
    renderChapters();

    const paid = list.filter(c => c.paid).length;
    log(`目录读取完成：发现 ${list.length} 个章节链接，其中 ${paid} 个根据目录标记疑似付费，已自动排除。请检查列表后抓取。`);
  } catch (e) {
    log("读取失败：" + e.message + "\n请稍后重试；如果代理不可用，网页端无法直接读取原站。");
  } finally {
    state.busy = false;
    $("findBtn").disabled = false;
  }
});

function extractBody(doc) {
  // Premium Content 是强制跳过标记
  const pageText = safeText(doc.body);
  if (/###\s*Premium\s*Content/i.test(pageText) ||
      /\bPremium\s+Content\b/i.test(pageText)) {
    return {paid:true, html:"", text:""};
  }

  const selectors = [
    ".contenta",
    ".reading-content",
    ".chapter-content",
    ".entry-content",
    ".wp-block-post-content",
    ".post-content",
    ".article-content",
    "#chapter-content",
    "article",
    "main"
  ];

  let candidates = [];
  for (const selector of selectors) {
    candidates = [...doc.querySelectorAll(selector)]
      .filter(el => safeText(el).length > 300);
    if (candidates.length) break;
  }

  if (!candidates.length) {
    throw new Error("找不到正文区域");
  }

  candidates.sort((a, b) => safeText(b).length - safeText(a).length);
  const body = candidates[0].cloneNode(true);

  body.querySelectorAll(
    "script,style,iframe,form,button,nav,header,footer,.ads,.advertisement"
  ).forEach(el => el.remove());

  const html = body.innerHTML.trim();
  const text = safeText(body);

  if (text.length < 100) throw new Error("提取到的正文太短");
  return {paid:false, html, text};
}

function renderPreviewOptions() {
  const sel = $("previewSelect");
  sel.replaceChildren();
  const chapters = state.downloaded.filter(c => c.text && !c.paid);

  if (!chapters.length) {
    sel.disabled = true;
    sel.add(new Option("暂无已抓取章节", ""));
    $("preview").textContent = "抓取完成后在这里预览。";
    return;
  }

  chapters.forEach((ch, i) => {
    sel.add(new Option(ch.title, String(i)));
  });
  sel.disabled = false;
  sel.value = "0";
  showPreview();
}

function showPreview() {
  const chapters = state.downloaded.filter(c => c.text && !c.paid);
  const index = Number($("previewSelect").value);
  const ch = chapters[index];
  const box = $("preview");

  box.style.fontSize = $("fontSize").value;
  box.style.lineHeight = $("lineHeight").value;

  if (!ch) {
    box.textContent = "暂无预览。";
    return;
  }

  box.replaceChildren();
  const heading = document.createElement("h3");
  heading.textContent = ch.title;
  const body = document.createElement("div");
  body.innerHTML = ch.html;
  box.append(heading, body);
}
$("previewSelect").addEventListener("change", showPreview);
$("fontSize").addEventListener("change", showPreview);
$("lineHeight").addEventListener("change", showPreview);

$("downloadBtn").addEventListener("click", async () => {
  if (state.busy) return;

  const targets = state.chapters.filter(c => c.selected && !c.paid);
  if (!targets.length) {
    log("请先勾选要抓取的免费章节。");
    return;
  }

  state.busy = true;
  $("downloadBtn").disabled = true;
  let success = 0, failed = 0, paid = 0;
  state.downloaded = [];

  try {
    for (let i = 0; i < targets.length; i++) {
      const ch = targets[i];
      log(`正在抓取 ${i + 1}/${targets.length}：${ch.title}`);

      try {
        const doc = await getHTML(ch.url);
        const result = extractBody(doc);

        if (result.paid) {
          ch.paid = true;
          ch.status = "付费正文已跳过";
          paid++;
        } else {
          ch.html = result.html;
          ch.text = result.text;
          ch.status = "成功";
          state.downloaded.push(ch);
          success++;
        }
      } catch (e) {
        ch.status = "失败：" + e.message;
        failed++;
      }

      renderChapters();
      updateSummary();
      await sleep(700);
    }
  } finally {
    state.busy = false;
    $("downloadBtn").disabled = false;
    renderPreviewOptions();
    renderChapters();
    updateSummary();
    log(`抓取结束。成功 ${success} 章；正文付费标记跳过 ${paid} 章；失败 ${failed} 章。`);
  }
});

function xhtmlEscape(s) {
  return String(s).replace(/&/g,"&amp;")
    .replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}
function slug(s) {
  return String(s).normalize("NFKD")
    .replace(/[^\w.-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,70) || "book";
}
function cleanChapterHTML(html) {
  const doc = new DOMParser().parseFromString("<div>" + html + "</div>", "text/html");
  const root = doc.body.firstElementChild || doc.body;
  root.querySelectorAll("script,style,iframe,form,button,nav,header,footer").forEach(e => e.remove());
  // 再次过滤付费提示，避免提示被嵌在正文元素里
  root.querySelectorAll("*").forEach(el => {
    if (/###\s*Premium\s*Content/i.test(safeText(el)) ||
        /\bPremium\s+Content\b/i.test(safeText(el))) {
      el.remove();
    }
  });
  return root.innerHTML;
}

$("epubBtn").addEventListener("click", async () => {
  if (typeof JSZip === "undefined") {
    $("epubStatus").textContent = "EPUB 组件加载失败，请检查网络或稍后重试。";
    return;
  }

  const chapters = state.downloaded.filter(c => c.text && !c.paid);
  if (!chapters.length) {
    $("epubStatus").textContent = "没有可生成的免费章节。";
    return;
  }

  const title = $("bookTitle").value.trim() || "Untitled";
  const author = $("author").value.trim();
  const lang = $("language").value;
  const zip = new JSZip();

  $("epubBtn").disabled = true;
  $("epubStatus").textContent = "正在生成 EPUB……";

  try {
    // EPUB 要求 mimetype 是第一个文件且不压缩
    zip.file("mimetype", "application/epub+zip", {compression:"STORE"});

    zip.file("META-INF/container.xml",
`<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
  <rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
</container>`);

    const oebps = zip.folder("OEBPS");
    const css =
`body{font-family:serif;font-size:${$("fontSize").value};line-height:${$("lineHeight").value};margin:5%;overflow-wrap:anywhere}
h1{text-align:center;font-size:1.35em;margin:0 0 1.5em}
p{margin:0 0 1em;text-indent:1em}
img{max-width:100%;height:auto}
`;
    oebps.file("style.css", css);

    const manifest = [];
    const spine = [];
    const nav = [];

    chapters.forEach((ch, i) => {
      const id = "ch" + (i + 1);
      const filename = id + ".xhtml";
      const safeTitle = xhtmlEscape(ch.title);
      const body = cleanChapterHTML(ch.html);

      oebps.file(filename,
`<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="${lang}" lang="${lang}">
<head><title>${safeTitle}</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
<body><h1>${safeTitle}</h1><div>${body}</div></body></html>`);

      manifest.push(`<item id="${id}" href="${filename}" media-type="application/xhtml+xml"/>`);
      spine.push(`<itemref idref="${id}"/>`);
      nav.push(`<li><a href="${filename}">${safeTitle}</a></li>`);
    });

    oebps.file("nav.xhtml",
`<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="${lang}" xml:lang="${lang}">
<head><title>目录</title></head><body><nav epub:type="toc" id="toc"><h1>目录</h1><ol>${nav.join("")}</ol></nav></body></html>`);

    manifest.unshift('<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>');
    manifest.unshift('<item id="css" href="style.css" media-type="text/css"/>');

    const bookId = "urn:uuid:" + crypto.randomUUID();
    const modified = new Date().toISOString().replace(/\.\d{3}Z$/, "Z");

    oebps.file("content.opf",
`<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid" xml:lang="${lang}">
<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
<dc:identifier id="bookid">${bookId}</dc:identifier>
<dc:title>${xhtmlEscape(title)}</dc:title>
<dc:language>${lang}</dc:language>
${author ? `<dc:creator>${xhtmlEscape(author)}</dc:creator>` : ""}
<meta property="dcterms:modified">${modified}</meta>
</metadata>
<manifest>${manifest.join("")}</manifest>
<spine>${spine.join("")}</spine>
</package>`);

    const blob = await zip.generateAsync({
      type:"blob",
      mimeType:"application/epub+zip",
      compression:"DEFLATE",
      compressionOptions:{level:6}
    });

    const a = document.createElement("a");
    const href = URL.createObjectURL(blob);
    a.href = href;
    a.download = slug(title) + ".epub";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 30000);

    $("epubStatus").textContent = `完成：已将 ${chapters.length} 章打包为 EPUB。`;
  } catch (e) {
    $("epubStatus").textContent = "生成失败：" + e.message;
  } finally {
    $("epubBtn").disabled = false;
  }
});

// 初始预填网址，但不自动抓取
})();
</script>
</body>
</html>
